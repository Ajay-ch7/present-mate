<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PresentMate Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>

  <!-- ── Status Badge (top-center) ─────────────────────────────── -->
  <div id="status-badge" class="status-badge hidden">
    <div class="status-icon" id="status-icon">
      <svg id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <svg id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <svg id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <span id="status-text">Ready</span>
    <div class="pulse-ring"></div>
  </div>

  <!-- ── Session Setup Panel (centered initially) ───────────────────── -->
  <div id="session-setup-panel" class="session-setup-panel visible">
    <h3>Connect to PresentMate</h3>
    <p>Paste the Session ID generated from your web dashboard.</p>
    <div class="session-input-row">
      <input type="text" id="session-id-input" placeholder="Enter session ID..." />
      <button id="connect-session-btn" class="pm-btn primary">Connect</button>
    </div>
    <div id="session-error-msg" class="error-text"></div>
  </div>

  <!-- ── Slide Summary Panel (top-right) ───────────────────────── -->
  <div id="summary-panel" class="summary-panel hidden">
    <div class="summary-header">
      <div class="ai-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
        Slide Summary
      </div>
      <div class="summary-header-actions">
        <button class="pm-btn danger btn-sm" id="stop-session-btn" title="End Session">Stop</button>
        <button class="dismiss-btn" id="dismiss-summary-btn" title="Dismiss">✕</button>
      </div>
    </div>
    <p id="summary-text" class="suggestion-text">Extracting slide content…</p>
    <div id="key-points-container" class="key-points-container" style="display:none">
      <div class="kp-label">Key Points</div>
      <ul id="key-points-list" class="kp-list"></ul>
    </div>
    <div class="slide-nav-controls">
      <button class="nav-btn" id="prev-slide-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span id="slide-indicator" class="slide-indicator">Slide - / -</span>
      <button class="nav-btn" id="next-slide-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>

  <!-- ── AI Coach Panel (bottom-right) ────────────────────────── -->
  <div id="suggestion-panel" class="suggestion-panel hidden">
    <div class="suggestion-header">
      <div class="ai-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        AI Coach
      </div>
      <button class="dismiss-btn" id="dismiss-btn" title="Dismiss">✕</button>
    </div>
    <p id="suggestion-text" class="suggestion-text">Waiting for speech to start coaching…</p>
    <div class="suggestion-footer">
      <div class="confidence-bar">
        <div class="confidence-fill" id="confidence-fill"></div>
      </div>
      <span class="confidence-label" id="confidence-label">—</span>
    </div>
  </div>

  <!-- ── Transcript Strip (left side) ──────────────────────────── -->
  <div id="transcript-panel" class="transcript-panel hidden">
    <div class="transcript-label">
      <span class="mic-dot" id="mic-dot" style="animation-play-state:paused; background: var(--text-muted);"></span>
      Live Transcript
    </div>
    <div id="transcript-text" class="transcript-text">Press Listen to start mic…</div>
    <div class="mic-controls">
      <button id="listen-btn" class="mic-btn mic-btn-listen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        Listen
      </button>
      <button id="stop-btn" class="mic-btn mic-btn-stop" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
        Stop
      </button>
    </div>
  </div>

  <!-- ── Corner Branding ────────────────────────────────────────── -->
  <div id="branding" class="branding hidden">
    <span class="brand-dot"></span>
    PresentMate
  </div>

  <script src="overlay.js"></script>
</body>
</html>
